# Gradle wrapper 配置。
#
# ⚠️ distributionUrl 不是随便填的：wrapper 用它算一个哈希来决定本地缓存目录
#    （GRADLE_USER_HOME/wrapper/dists/gradle-<版本>-<类型>/<哈希>）。URL 换了缓存就
#    命中不了，wrapper 会**重新下载整个 220MB 的 Gradle** —— 在没网或被墙的环境直接
#    构建失败（本机实测踩过）。
#
#    本项目的发行包是从**腾讯云镜像**取的，所以这里必须写同一个 URL：
#      哈希 2x09zxy9y9fz2e9j6blrf3xag = md5("https://mirrors.cloud.tencent.com/gradle/gradle-9.1.0-all.zip")
#    换成 services.gradle.org 会得到不同的哈希（7wzd0jkjit61aq2p43wpjgij9），缓存作废。
#
#    如果你本地已有别的发行版，直接改这一行指向它、或设 DSH_GRADLE 跳过 wrapper。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.1.0-all.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
