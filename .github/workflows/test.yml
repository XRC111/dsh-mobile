# 回归测试 + APK 构建。
#
# ── 为什么现在才有 CI ────────────────────────────────────────────────────────
# 本仓库原先没有任何 CI，测试一直在本机跑。本机没有硬上限，容易「改完顺手跑一下、
# 忘了跑全套」—— 这次做流式中转就真的漏了 test:link-copies（分发副本没同步），
# 是 sync 之后才补跑才发现的。放进 CI 之后，漏跑不再依赖记性。
#
# ── ⚠️ 为什么这里不 checkout dsh-desktop ─────────────────────────────────────
# apk-build 需要 dsh-desktop/resources/dsh-runtime（461MB / 26496 文件），
# 三个脚本也都默认去找本机路径 D:/code/dsh-desktop。两种 checkout 写法都试过，
# 都不行：
#
#   ① path 放在工作区内 → 第二个 checkout 会先 "Deleting the contents of
#      <workspace>"，把前一个 checkout 出来的 dsh-mobile 自己一起删掉；
#   ② path 指向工作区外 → checkout 直接拒绝：
#      "Repository path '…\dsh-mobile\dsh-desktop' is not under '…\dsh-mobile'"。
#
# checkout 的 path 本来就设计成「工作区内的子目录」，不是任意路径。
# 所以改成：**运行时作为 artifact 传进来**，CI 不碰 dsh-desktop 仓库。
#
# 代价：test:link-copies 校验的 dsh-desktop 分发副本在这条流水线里拿不到，
# 该项自动跳过（脚本对找不到仓库有守卫）。不致命 —— copies 的**主要**作用
# （规范源 ↔ 两份插件副本逐字节一致）仍被覆盖，那份分发副本由开发者机器上的
# sync-desktop-plugin.mjs 同步。
#
# ── 运行时 artifact 从哪来 ────────────────────────────────────────────────────
# 手动：本地跑 npm run pack:runtime，然后
#   gh workflow run runtime-pack.yml
# 或直接用本地已有的 app/src/main/assets/bundle/dsh-runtime.bin（43.9MB）。
# 由 runtime-pack.yml 负责上传，apk-build 负责下载 —— 两者分离是为了
# 「运行时没变就别重跑 44MB 的传输」。
#
# ── 跑什么 ────────────────────────────────────────────────────────────────────
# 直接跑 npm run test:all，不逐个列举 —— 少写一个套件名就等于少跑一个测试，
# 而这种遗漏在 CI 上表现为「它一直是绿的」，比红更危险。清单只有一个来源。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  node-tests:
    # windows-2022 与桌面仓库一致；这里没有平台相关逻辑，
    # 但保持同一 runner 能让「两仓库的失败原因可比」。
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ⚠️ 不设 cache: 'npm'，不跑 npm ci：这个仓库 dependencies 与
      #    devDependencies 都是空的，也没有 package-lock.json。
      #    setup-node 的 cache 找不到 lock 文件会直接报错（首次跑就栽在这）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 同步协议副本
        # ⚠️ 必须在测试**之前**跑：test:link-copies 校验副本逐字节一致。
        #    不同步的话它必然红，而那是「没同步」而非「有缺陷」——
        #    混成同一个红会让人养成「看见 copies 红就忽略」的习惯。
        run: node scripts/sync-link-protocol.mjs

      - name: 跑全部测试
        run: npm run test:all

  apk-build:
    # APK 构建单开一个 job：它要 44MB 运行时与 Gradle 缓存，比测试慢得多，
    # 混在一起会让「测试挂了」要等构建完才看得到。
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 取运行时
        uses: actions/download-artifact@v4
        with:
          # 找不到时不报错而是接着跑：仓库里可能已有一份（虽然 .gitignore 排除了
          # dsh-runtime.bin，但开发机上往往已经打好）。让 build 自己报缺什么，
          # 比在这里报「artifact 不存在」更容易懂。
          name: dsh-runtime
          path: runtime-artifact
          merge-multiple: true

      - name: 落位运行时
        run: |
          # artifact 里是 pack:runtime 的产物（dsh-runtime.bin + manifest），
          # 直接放到 assets/bundle/ —— 也就是 build:apk 会读的位置。
          # 不走 pack:runtime：它需要 dsh-desktop 那 461MB 源码树来重新打包，
          # 而运行时本身没变时重新打包毫无意义（tar 字节级一致却要花几分钟）。
          $src = 'runtime-artifact'
          $dst = 'app/src/main/assets/bundle'
          if (-not (Test-Path "$src/dsh-runtime.bin")) {
            Write-Host "artifact 里没有 dsh-runtime.bin，实际内容："
            Get-ChildItem $src -Recurse -File | Select-Object -First 10 FullName
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/*" $dst -Force
          Write-Host ("运行时已落位：{0:N1} MB" -f ((Get-Item "$dst/dsh-runtime.bin").Length / 1MB))
          if (Test-Path "$src/runtime-manifest.json") {
            New-Item -ItemType Directory -Force -Path 'build' | Out-Null
            Copy-Item "$src/runtime-manifest.json" 'build/' -Force
          }

      - name: 构建 APK（debug）
        run: npm run build:apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error